name: Deploy Home Love (frontend + backend to Apps Script)

# build frontend + deploy ไป Apps Script ตัวเดียว (HTML Service serve หน้าเว็บ + JSON API)
#
# ⛔ ปิดการทำงานอัตโนมัติแล้ว (2026-07-26) — ผู้ใช้เลือก deploy จากเครื่องตัวเองเป็นหลัก
#    ด้วย `cd apps-script && npm run redeploy`  GitHub เหลือหน้าที่แค่สำรองซอร์สโค้ด
#    push ขึ้น main จะไม่ deploy อะไรอีก (เหลือแต่รันมือผ่านปุ่ม Run workflow)
#
# 📌 deployment id กับ URL ย้ายจาก secret มาเขียนตรงนี้ (2026-07-27)
#    ทั้งสองค่าไม่ใช่ความลับ — มันคือ URL ที่เบราว์เซอร์ทุกเครื่องในบ้านเปิดอยู่ทุกวัน
#    ที่ย้ายเพราะตอนเก็บเป็น secret มันค้างไม่ตรงกับของจริงอยู่หลายเดือนโดยไม่มีใครเห็น
#    (แก้ที่เครื่องแล้วลืมไปแก้บน GitHub) อยู่ในไฟล์แบบนี้เห็นพร้อมโค้ด แก้ที่เดียวจบ
#    ⚠️ ถ้าเปลี่ยนไปใช้ deployment ใหม่ ต้องแก้ 3 ที่ให้ตรงกัน:
#       apps-script/.clasp-deployment.json · frontend/.env (ทั้งคู่ gitignored) · env: ข้างล่างนี้
#
# 🔐 ที่ยังต้องเป็น secret จริงๆ:
#    - CLASPRC_JSON    : token ของ clasp หมดอายุได้ ต้อง `clasp login` ใหม่แล้วคัดลอกมาใส่
#    - CLASP_SCRIPT_ID : id ของโปรเจกต์ Apps Script
on:
  workflow_dispatch: {}

env:
  # URL /exec ของ deployment ปัจจุบัน — vite อ่านตัวแปรนี้ตอน build
  # (frontend serve จาก URL นี้ แต่ยังต้อง fetch ไปที่ URL เต็ม เพราะหน้าเว็บ
  # render อยู่ใน sandboxed iframe คนละ origin กับ script.google.com)
  VITE_API_URL: https://script.google.com/macros/s/AKfycbyAojwYlNn2LNcL__ODWwJ6U-N9PT4LvyblYk2DzdYK3Ln6PBlEoQ4ROqeYA8VVnYBHQg/exec
  # deployment ที่ต้อง deploy ทับ เพื่อให้ URL ที่ผู้ใช้เปิดอยู่ไม่เปลี่ยน
  DEPLOYMENT_ID: AKfycbyAojwYlNn2LNcL__ODWwJ6U-N9PT4LvyblYk2DzdYK3Ln6PBlEoQ4ROqeYA8VVnYBHQg

# deploy ทีละครั้ง (ห้ามยกเลิกกลางคัน เพราะ clasp deploy ควรทำจบ)
concurrency:
  group: clasp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Sync build เข้า apps-script/Index.html
        run: node sync-frontend.mjs
        working-directory: apps-script

      - name: Install clasp
        run: npm install -g @google/clasp@2.5.0

      - name: Write clasp credentials (~/.clasprc.json)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Write .clasp.json (scriptId)
        working-directory: apps-script
        env:
          SCRIPT_ID: ${{ secrets.CLASP_SCRIPT_ID }}
        run: |
          printf '{ "scriptId": "%s", "rootDir": "." }' "$SCRIPT_ID" > .clasp.json

      - name: Push code
        working-directory: apps-script
        run: clasp push -f

      - name: Deploy web app (คง URL เดิม)
        working-directory: apps-script
        run: clasp deploy -i "$DEPLOYMENT_ID" -d "ci ${GITHUB_SHA::7}"
